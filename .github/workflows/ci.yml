name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Smoke test the CLI
        run: |
          photo-rename --help
          mkdir -p /tmp/smoke
          python - <<'PY'
          from PIL import Image
          im = Image.new("RGB", (16, 16))
          ex = im.getexif()
          ex.get_ifd(0x8769)[36867] = "2026:08:02 23:44:12"
          im.save("/tmp/smoke/IMG_0001.jpg", exif=ex)
          PY
          photo-rename /tmp/smoke --show-times
          photo-rename /tmp/smoke --apply
          test -f /tmp/smoke/2026-08-02-2344.jpg
